[project]
name = "vllm-sim"
version = "0.1.0"
description = "A queueing-model simulator of a self-hosted vLLM inference server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
